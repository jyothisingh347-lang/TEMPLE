<html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Xcape Mobile</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Stops screen from scrolling */
        }
        h1 {
            margin: 5px 0;
            color: #e94560;
            font-size: 24px;
        }
        #scoreBoard {
            font-size: 20px;
            margin-bottom: 10px;
            color: #0f3460;
            background: #fff;
            padding: 5px 15px;
            border-radius: 10px;
            font-weight: bold;
        }
        #gameContainer {
            border: 4px solid #e94560;
            background-color: #16213e;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
            border-radius: 5px;
        }
        canvas {
            display: block;
        }
        /* Mobile D-Pad Styling */
        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 0 #b02a42;
            cursor: pointer;
            touch-action: manipulation; /* Improves touch responsiveness */
        }
        .btn:active {
            box-shadow: 0 0 0 #b02a42;
            transform: translateY(4px);
        }
        #upBtn { grid-column: 2; grid-row: 1; }
        #leftBtn { grid-column: 1; grid-row: 2; }
        #downBtn { grid-column: 2; grid-row: 2; }
        #rightBtn { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <h1>SNAKE XCAPE</h1>
    <div id="scoreBoard">Score: <span id="score">0</span></div>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="300" height="300"></canvas>
    </div>

    <div class="controls">
        <button class="btn" id="upBtn">▲</button>
        <button class="btn" id="leftBtn">◄</button>
        <button class="btn" id="downBtn">▼</button>
        <button class="btn" id="rightBtn">►</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Grid config - scaled for 300px width
        const gridSize = 15; 
        const tileCount = canvas.width / gridSize;

        // Snake properties - Starts as 1 tiny block
        let snake = [
            {x: 10, y: 10}
        ];
        let dx = 1; 
        let dy = 0; 

        // Food properties
        let foodX;
        let foodY;

        let score = 0;
        let gameInterval;

        // Start Game
        generateFood();
        // SPEED CONTROLLER: Changed from 100ms to 250ms to make it much slower
        gameInterval = setInterval(main, 250); 

        // Main game loop
        function main() {
            if (hasGameEnded()) {
                alert("XCAPE FAILED! Your Score: " + score);
                resetGame();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#16213e"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#00ffcc"; // Neon cyan snake
            ctx.strokeStyle = "#16213e"; 

            snake.forEach(part => {
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            const hasEatenFood = snake[0].x === foodX && snake[0].y === foodY;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);

            snake.forEach(part => {
                const hasSpawnedOnSnake = part.x === foodX && part.y === foodY;
                if (hasSpawnedOnSnake) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#e94560"; // Red food
            // Draw round food for a modern touch
            ctx.beginPath();
            ctx.arc(foodX * gridSize + gridSize/2, foodY * gridSize + gridSize/2, gridSize/2.2, 0, 2 * Math.PI);
            ctx.fill();
        }

        // Logic to process direction changes
        function changeDirection(newDx, newDy) {
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            // Prevent reversing into itself
            if (newDx === -1 && goingRight) return;
            if (newDy === -1 && goingDown) return;
            if (newDx === 1 && goingLeft) return;
            if (newDy === 1 && goingUp) return;

            dx = newDx;
            dy = newDy;
        }

        // --- BUTTON EVENT LISTENERS FOR MOBILE ---
        document.getElementById('upBtn').addEventListener('touchstart', (e) => { e.preventDefault(); changeDirection(0, -1); });
        document.getElementById('upBtn').addEventListener('mousedown', () => changeDirection(0, -1));

        document.getElementById('downBtn').addEventListener('touchstart', (e) => { e.preventDefault(); changeDirection(0, 1); });
        document.getElementById('downBtn').addEventListener('mousedown', () => changeDirection(0, 1));

        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); changeDirection(-1, 0); });
        document.getElementById('leftBtn').addEventListener('mousedown', () => changeDirection(-1, 0));

        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); changeDirection(1, 0); });
        document.getElementById('rightBtn').addEventListener('mousedown', () => changeDirection(1, 0));


        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        function resetGame() {
            snake = [{x: 10, y: 10}]; // Reset to small
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            generateFood();
        }
    </script>
</body>
</html>
